
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUICO AND LACLAC Tech Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B0E14;
            color: #E2E8F0;
            overflow-x: hidden;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .neon-glow-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.5); }
        .neon-glow-violet { text-shadow: 0 0 10px rgba(139, 92, 246, 0.5); }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0B0E14; }
        ::-webkit-scrollbar-thumb {
            background: #1E293B;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; filter: blur(40px); }
            50% { opacity: 0.8; filter: blur(60px); }
        }
        .bg-blob {
            position: fixed;
            z-index: -1;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            animation: pulse-glow 10s infinite;
        }

        @keyframes border-cycle {
            0% { border-color: #22d3ee; box-shadow: 0 0 15px rgba(34, 211, 238, 0.3); }
            25% { border-color: #a78bfa; box-shadow: 0 0 15px rgba(167, 139, 250, 0.3); }
            50% { border-color: #2dd4bf; box-shadow: 0 0 15px rgba(45, 212, 191, 0.3); }
            75% { border-color: #f472b6; box-shadow: 0 0 15px rgba(244, 114, 182, 0.3); }
            100% { border-color: #22d3ee; box-shadow: 0 0 15px rgba(34, 211, 238, 0.3); }
        }
        .animate-border-cycle {
            animation: border-cycle 8s infinite linear;
            border-width: 1px;
        }
        .project-thumb-container {
            transition: box-shadow 0.4s ease-in-out;
        }
        .project-thumb-container:hover {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.5);
        }

        @keyframes neon-pulse {
            0%, 100% { text-shadow: 0 0 5px rgba(6, 182, 212, 0.2); opacity: 0.7; }
            50% { text-shadow: 0 0 12px rgba(6, 182, 212, 0.6); opacity: 1; }
        }
        .animate-neon-pulse {
            animation: neon-pulse 3s infinite ease-in-out;
        }
    </style>
<script type="importmap">
{

</html>
